# Déploie le site (app/) et l'API (api/) sur Azure Static Web Apps à chaque push sur main.
# Pas d'environnement de préversion pour les PR : il n'aurait pas les réglages de l'API
# (TABLES_CONNECTION, AUTH_SECRET), qui ne sont définis que pour la production.
name: Deploy to Azure

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: app
          api_location: api
          output_location: dist
